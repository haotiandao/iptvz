name: hotel_iptv

on:
  # schedule:
  #   - cron: '0 7,22 * * *'
  workflow_dispatch:

# ★ 关键修复：给 GITHUB_TOKEN 写权限（对 main 分支 push 必需）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 获取酒店源
        run: |
          cd $GITHUB_WORKSPACE
          python ./iptv.py

      - name: 提交更改
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "GitHub Action"
          git add .
          # 有变更才提交，否则直接跳过（避免 "nothing to commit" 报错）
          if git diff --cached --quiet; then
            echo "没有文件变更，跳过提交"
          else
            git commit -m "更新直播源"
            git push
          fi
